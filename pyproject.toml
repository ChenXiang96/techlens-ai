[project]
name = "techlens"
version = "0.1.0"
description = "Evidence-grounded open-source technology adoption due diligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techlens"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
