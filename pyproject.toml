[project]
name = "techlens"
version = "0.1.0"
description = "Evidence-grounded open-source technology adoption due diligence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
    "langgraph>=1.0,<2.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
]

[project.scripts]
techlens = "techlens.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techlens"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/techlens", "tests", "docs", "examples", "evals/t006", "qa/t011",
    "README.md", "CONTRIBUTING.md", "LICENSE", "pyproject.toml", "uv.lock",
    ".gitignore", ".gitattributes",
]
exclude = [
    "**/__pycache__/**", "**/*.pyc", "**/*.pyo", "/.git/**", "/.venv/**",
    "/.pytest_cache/**", "/build/**", "/dist/**", "/qa/t012/**",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
